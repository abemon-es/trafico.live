proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=60m;

# Per-visitor rate limit on /dynamic/ (Martin). One visitor panning a map fast
# asks for 30-45 tiles a second; Martin answers one tile per connection of its
# pool, so a burst like that holds every connection and the other visitors'
# tiles wait past proxy_read_timeout and get a 504 (411 of them in the 24 h to
# 2026-11-06 07:30, all on /dynamic/). The key is the last address in
# X-Forwarded-For, the one the reverse proxy in front appended, so a client
# can't pick its own; $remote_addr alone is that proxy for everyone, and it
# stays as the fallback for a request that arrives without the header.
map $http_x_forwarded_for $tiles_visitor {
    default                  $remote_addr;
    "~(?<last>[^, ]+) *$"    $last;
}
limit_req_zone $tiles_visitor zone=dynamic_visitor:10m rate=5r/s;

# The image's `main` format plus how long each request took (rt), how long
# Martin took to answer (urt; "-" when served from cache), the cache status
# and what the per-visitor limit did (limit: PASSED, DELAYED or REJECTED; "-"
# outside /dynamic/), so a slow tile function and a throttled visitor both
# show up in the log. The forwarded address stays the last field, as in `main`.
log_format tiles '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                 'cache=$upstream_cache_status limit=$limit_req_status "$http_x_forwarded_for"';

upstream martin {
    # Resolve via Docker DNS: Martin is the `martin` service of this compose
    # project and listens on its internal port 3000. A fixed address used
    # here before pointed at the wrong host and port, and every /dynamic/
    # tile answered 502.
    server martin:3000;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log tiles;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Prometheus stub_status — internal only (nginx-exporter sidecar)
    location /nginx_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # PMTiles files — needs HTTP range requests
    location /tiles/ {
        alias /data/tiles/;

        # CORS — allow trafico.live and localhost
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, If-Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length, Accept-Ranges' always;

        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range, If-Range';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        # Enable range requests (critical for PMTiles)
        add_header Accept-Ranges bytes always;

        # Cache headers — tiles don't change often
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;

        types {
            application/octet-stream pmtiles;
        }
    }

    # Serve the PMTiles file at root level too (for pmtiles:// protocol)
    location ~ ^/([^/]+\.pmtiles)$ {
        alias /data/tiles/$1;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, If-Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length, Accept-Ranges' always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range, If-Range';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Dynamic vector tiles from Martin (real-time PostGIS layers)
    # Martin runs at root, nginx mounts it at /dynamic/. We rewrite
    # TileJSON responses so tile URLs include the /dynamic/ prefix.
    location /dynamic/ {
        # 5 tiles a second per visitor. A burst of 40 is accepted: the first
        # 20 go through at once (a full viewport of one layer is 12-20 tiles)
        # and the next 20 are spaced to the rate; past that, 429 right away
        # instead of a 10 s wait for a 504. Cached tiles count too: the limit
        # is on what one visitor asks for, not on what reaches Martin.
        # OPTIONS preflights return above this phase and are not counted.
        limit_req zone=dynamic_visitor burst=40 delay=20;
        limit_req_status 429;

        proxy_pass http://martin/;
        proxy_cache tiles;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 204 30s;
        proxy_cache_use_stale updating;
        proxy_cache_background_update on;
        proxy_cache_key "$uri";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        # Decompress Martin's response so sub_filter can rewrite URLs
        # (nginx will re-gzip the output via the gzip directive)
        proxy_set_header Accept-Encoding "";

        # Rewrite Martin TileJSON tile URLs to include /dynamic/ prefix
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"https://tiles.trafico.live/' '"https://tiles.trafico.live/dynamic/';
        sub_filter '"http://tiles.trafico.live/' '"http://tiles.trafico.live/dynamic/';
        # Also handle relative URLs Martin may generate
        sub_filter '"http://localhost/' '"https://tiles.trafico.live/dynamic/';
        sub_filter '"http://0.0.0.0:3000/' '"https://tiles.trafico.live/dynamic/';

        # Strip Martin's CORS headers to avoid duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header X-Cache-Status $upstream_cache_status always;
        # Browser cache: 30s for dynamic tiles (service worker handles longer caching)
        add_header Cache-Control "public, max-age=30, stale-while-revalidate=60" always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Font glyphs — immutable (never change, cache forever)
    location /fonts/ {
        alias /data/fonts/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Sprite assets — immutable
    location /sprites/ {
        alias /data/sprites/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
