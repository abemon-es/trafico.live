services:
  tiles:
    # Without this Docker defaults to `no`: a crash or a host reboot leaves
    # tiles.trafico.live dead until someone notices and runs compose by hand.
    # These two were the only public-facing containers in the fleet without a
    # policy — and the exporter that measures them had one, so a reboot would
    # have left a healthy monitor reporting on containers that no longer exist.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      martin:
        condition: service_started
    ports:
      - "8088:80"
    volumes:
      - /opt/trafico/tiles/tiles:/data/tiles:ro
      - /opt/trafico/tiles/fonts:/data/fonts:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Traefik routing handled by its file provider on the host
    # (routes to host port 8088, avoids Docker network cross-network issues with Martin)
    labels:
      - "traefik.enable=false"

  martin:
    restart: unless-stopped
    build:
      context: ../martin
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    # Martin and the exporter are reachable only on the private network:
    # PRIVATE_BIND_IP (in .env next to this file) is this host's private
    # address. Compose refuses to start without it rather than bind them
    # anywhere else.
    ports:
      - "${PRIVATE_BIND_IP:?set PRIVATE_BIND_IP in .env}:3089:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: tiles-nginx-exporter
    command: ["--nginx.scrape-uri=http://tiles/nginx_status"]
    ports:
      - "${PRIVATE_BIND_IP:?set PRIVATE_BIND_IP in .env}:9113:9113"
    depends_on:
      - tiles
    restart: unless-stopped
