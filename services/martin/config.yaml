# Martin tile server configuration
# Serves real-time PostGIS layers as vector tiles (MVT)
# Tables use lat/lng decimals — geometry constructed via SQL functions

# No tile cache in Martin. Without this key it keeps 512 MB of tiles with no
# expiry, so every layer here is served as it was when first requested: on
# 2026-10-20 incidents/5/15/12 came back at 58,770 bytes while the function
# returned 319,360 (container up 10 days). nginx in front already caches each
# tile for 60 s (services/tiles/nginx.conf).
cache_size_mb: 0

# Prometheus metrics at /_/metrics (same port as tile API)
observability:
  metrics:
    add_labels:
      service: martin-tile
      env: prod

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 4
  auto_publish: false

  functions:
    # --- Real-time traffic ---
    sensors:
      schema: public
      function: tile_sensors
    incidents:
      schema: public
      function: tile_incidents
    roadworks:
      schema: public
      function: tile_roadworks
    city_sensors:
      schema: public
      function: tile_city_sensors

    # --- Transport ---
    fleet:
      schema: public
      function: tile_fleet
    aircraft:
      schema: public
      function: tile_aircraft
    vessels:
      schema: public
      function: tile_vessels
    transit_vehicles:
      schema: public
      function: tile_transit_vehicles

    # --- Maritime ---
    emergencies:
      schema: public
      function: tile_emergencies
